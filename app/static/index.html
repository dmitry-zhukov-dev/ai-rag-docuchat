<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuChat</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>DocuChat</h1>
            </div>
            <div class="sidebar-actions">
                <button id="create-workspace-btn" class="btn btn-primary">+ New Workspace</button>
            </div>
            <div id="workspace-list" class="workspace-list">
                <!-- Workspace items will be rendered here by app.js -->
            </div>
            <div id="workspace-loading" class="loading hidden">
                <div class="spinner"></div>
                <span>Loading workspaces...</span>
            </div>
            <div id="workspace-error" class="error-message hidden">
                Failed to load workspaces.
            </div>
        </aside>

        <main class="main-content">
            <div id="empty-state" class="empty-state">
                <h2>Welcome to DocuChat</h2>
                <p>Select a workspace from the sidebar to get started, or create a new one.</p>
            </div>
            <div id="workspace-view" class="workspace-view hidden">
                <div class="workspace-view-header">
                    <h2 id="workspace-name">Workspace Name</h2>
                </div>
                
                <div class="document-section">
                    <h3>Documents</h3>
                    <div class="upload-controls">
                        <input type="file" id="file-input" accept=".txt,.pdf">
                        <button id="upload-btn" class="btn btn-primary">Upload</button>
                    </div>
                    <div id="upload-loading" class="loading hidden">Uploading...</div>
                    <div id="document-list" class="document-list">
                        <!-- Documents rendered here -->
                    </div>
                </div>

                <div class="chat-section">
                    <h3>Chat</h3>
                    <div class="chat-controls">
                        <button id="new-chat-btn" class="btn btn-primary">+ New Chat</button>
                    </div>
                    <div id="conversation-list" class="conversation-list"></div>
                    <div id="chat-window" class="chat-window hidden">
                        <h4 id="chat-title">Conversation</h4>
                        <div id="message-history" class="message-history"></div>
                        <div class="chat-input-area">
                            <input type="text" id="chat-input" placeholder="Ask a question...">
                            <button id="send-chat-btn" class="btn btn-primary">Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
