<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuChat</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="simple-chat">
        <header><h1>DocuChat</h1><p>Ask questions about your documents.</p></header>
        <div id="initialization-status" role="status">Preparing your chat…</div>
        <button id="reconnect-btn" class="btn hidden">Reconnect</button>
        <section class="document-section" aria-label="Documents">
            <button id="upload-area" class="upload-area" disabled>
                Drop a PDF or TXT here, or click to choose a file
            </button>
            <input type="file" id="file-input" accept=".txt,.pdf" hidden>
            <p id="upload-hint" class="hint">One file at a time. Your browser cookie keeps access to this chat.</p>
            <div id="upload-status" role="status" aria-live="polite"></div>
            <div id="document-list" class="document-list"></div>
            <div id="document-error" class="error-message hidden" role="alert"></div>
            <button id="refresh-documents-btn" class="btn">Refresh status</button>
        </section>
        <section class="chat-section" aria-label="Chat">
            <div id="message-history" class="message-history" aria-label="Conversation history"></div>
            <div id="chat-loading" class="loading hidden" role="status">Thinking…</div>
            <form id="chat-form" class="chat-input-area">
                <input type="text" id="chat-input" aria-label="Question" maxlength="10000" placeholder="Upload a document to start…" disabled>
                <button id="send-chat-btn" class="btn btn-primary" disabled>Send</button>
            </form>
        </section>
    </main>
    <div id="app-error" class="toast hidden" role="alert"></div>
    <script src="/static/js/app.js"></script>
</body>
</html>
